name: Check public Realt metric names
on:
  pull_request:
    paths:
      - docs/index.html
      - docs/dashboard.js
      - tests/probe_public_phone_metrics.py
      - .github/workflows/probe-public-metrics.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check docs/dashboard.js
      - run: |
          python -m pip install requests
          PYTHONPATH=. python tests/probe_public_phone_metrics.py
