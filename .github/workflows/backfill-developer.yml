name: Build reviewed developer filter manifest
on:
  push:
    branches:
      - realt-kufar-parity-rebuild-20261027
    paths:
      - scripts/backfill_developer_manifest.py
      - pipeline/developer_filter.py
      - .github/workflows/backfill-developer.yml
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: PYTHONPATH=. python scripts/backfill_developer_manifest.py
      - name: Commit reference classification to test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/developer_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: verified developer-only UUID manifest"
            git push
          fi
