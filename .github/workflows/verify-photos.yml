name: Verify Realt photo manifest
on:
  pull_request:
    paths:
      - pipeline/collect.py
      - .github/workflows/verify-photos.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile pipeline/collect.py
