name: Audit Minsk Mir newbuild filter
on:
  pull_request:
    paths:
      - pipeline/developer_filter.py
      - scripts/audit_developer_filter.py
      - .github/workflows/audit-developer.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: PYTHONPATH=. python scripts/audit_developer_filter.py
