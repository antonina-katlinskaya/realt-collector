name: Dashboard JavaScript check

on:
  pull_request:
    paths:
      - 'docs/dashboard.js'
      - 'collector.py'
      - 'tests/test_collector_views.py'
      - 'tests/probe_views_order.py'
      - 'tests/dashboard.test.cjs'
      - 'tests/dashboard-diagnostics.cjs'
      - '.github/workflows/dashboard-check.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Python view mapping and syntax
        run: |
          python -m py_compile collector.py
          python -m unittest discover -s tests -p 'test_collector_views.py' -v
      - name: Verify JavaScript syntax
        run: node --check docs/dashboard.js
      - name: Run dashboard regression tests
        run: node --test tests/dashboard.test.cjs
      - name: Diagnose extreme view deltas (read only)
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/antonina-katlinskaya/realt-collector/main/data/snapshots.csv' -o /tmp/realt-current.csv
          mkdir -p /tmp/realt-archive
          for day in $(seq -w 20 26); do curl -fsSL "https://raw.githubusercontent.com/antonina-katlinskaya/realt-collector/main/data/snapshots/2026-10-${day}.csv.gz" -o "/tmp/realt-archive/2026-10-${day}.csv.gz"; done
          curl -fsSL 'https://raw.githubusercontent.com/antonina-katlinskaya/realt-collector/main/data/listings_seen.json' -o /tmp/realt-seen.json
          ARCHIVE_DIR=/tmp/realt-archive SEEN_FILE=/tmp/realt-seen.json node tests/dashboard-diagnostics.cjs /tmp/realt-current.csv --archive
      - name: Probe Realt batch/singleton view correspondence
        run: |
          python -m pip install requests
          python tests/probe_views_order.py
