name: Realt competitor watch

on:
  schedule:
    - cron: "25 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/competitor-watch.yml, competitor-watch.mjs]

permissions:
  contents: write

concurrency:
  group: realt-competitor-watch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node competitor-watch.mjs
      - name: Save complete competitor snapshot
        run: |
          git config user.name realt-collector
          git config user.email bot@users.noreply.github.com
          git add docs/competitor-watch.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh Realt competitor watch"
          git pull --rebase origin main
          git push origin HEAD:main
