name: Audit Realt new-build source fields
on:
  push:
    branches: [realt-strict-newbuild-filter-20261027]
    paths: [tests/audit_newbuild_source.py, .github/workflows/audit-newbuild.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python tests/audit_newbuild_source.py
