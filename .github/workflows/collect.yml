name: Realt collector

on:
  schedule:
    # каждые 3 часа (UTC). Правь расписание под себя: https://crontab.guru
    - cron: "0 6,9,12,15,18 * * *"
  workflow_dispatch: {}   # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write          # чтобы коммитить собранные данные обратно в репозиторий

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect
        run: python collector.py

      - name: Analytics
        run: python analytics.py

      - name: Commit data
        run: |
          git config user.name "realt-collector"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "нет изменений"
          git push
