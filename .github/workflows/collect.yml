name: Realt collector

on:
  schedule:
    # 07:10/07:40..21:40 Minsk; freshness gate starts hourly.
    - cron: "10,40 4-18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/collect.yml
      - .github/scripts/collection_due.py
      - pipeline/**
      - tests/**

permissions:
  contents: write

concurrency:
  group: realt-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Verify scheduler and archive safety
        run: python -m unittest discover -s tests -v

      - name: Check whether collection is due
        id: freshness
        run: python .github/scripts/collection_due.py

      - name: Collect
        id: collect
        if: steps.freshness.outputs.due == 'true'
        env:
          COLLECTION_SLOT: ${{ steps.freshness.outputs.slot }}
        run: python -u -m pipeline.collect

      - name: Verify new snapshot
        if: steps.freshness.outputs.due == 'true'
        env:
          PREVIOUS_SNAPSHOT: ${{ steps.freshness.outputs.last_snapshot }}
        run: |
          python - <<'PY'
          import json, os
          with open('data/collection_state.json', encoding='utf-8') as f:
              state = json.load(f)
          if state.get('complete') is not True:
              raise SystemExit('Incomplete snapshot')
          latest = state['snapshot_at']
          if not latest or latest <= os.environ['PREVIOUS_SNAPSHOT']:
              raise SystemExit('Collector did not produce a new non-empty snapshot')
          print('Verified new snapshot:', latest)
          PY

      - name: Analytics
        if: steps.freshness.outputs.due == 'true'
        run: python analytics.py

      - name: Commit data
        if: always() && steps.freshness.outputs.due == 'true'
        run: |
          git config user.name "realt-collector"
          git config user.email "bot@users.noreply.github.com"
          if [ "${{ steps.collect.outcome }}" = "success" ]; then
            git add data
          else
            git add data/health
          fi
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main

