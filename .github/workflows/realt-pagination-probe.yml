name: Realt pagination sort read-only probe
on:
  push:
    branches: [fix/realt-live-pagination-drift-20261109]
    paths: ['.github/workflows/realt-pagination-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Verify stable createdAt ordering on live public Realt query
        run: |
          python - <<'PY'
          import requests, time
          import config as C, queries as Q
          session=requests.Session()
          session.headers.update({'content-type':'application/json','user-agent':C.USER_AGENT,'accept':'application/json'})
          all_rows=[]
          for p in (1,2,3):
              variables={'data':{
                'where':{'agencyUuids':[C.AGENCIES['etazhi']],'addressV2':[{'townUuid':C.TOWN_UUID}],'category':C.CATEGORY},
                'pagination':{'page':p,'pageSize':C.PAGE_SIZE},
                'sort':[{'by':'createdAt','order':'ASC'}],
                'extraFields':None,'isReactAdaptiveUA':True}}
              payload=[{'operationName':'searchObjects','variables':variables,'query':Q.SEARCH_OBJECTS_QUERY}]
              r=session.post(C.GRAPHQL_URL,json=payload,timeout=25);r.raise_for_status()
              data=r.json()[0]
              if data.get('errors') or data.get('data',{}).get('searchObjects',{}).get('errors'):
                  raise RuntimeError('Server rejected createdAt ASC sort: '+str(data.get('errors') or data['data']['searchObjects']['errors']))
              body=data['data']['searchObjects']['body']
              rows=body['results']; dates=[row.get('createdAt') for row in rows]
              print('page',p,'total',body['pagination']['totalCount'],'rows',len(rows),'dates',dates[:2],dates[-2:],flush=True)
              if len(rows)!=C.PAGE_SIZE or not all(dates):raise RuntimeError('Missing data in sorted response')
              all_rows.extend(rows)
              if p<3:time.sleep(3)
          dates=[x['createdAt'] for x in all_rows]
          if dates != sorted(dates):raise RuntimeError('Live source does not respect createdAt ASC ordering')
          if len({x['uuid'] for x in all_rows})!=len(all_rows):raise RuntimeError('Live sort overlaps on adjacent pages')
          print('VERIFIED: createdAt ASC with unique UUIDs on first three pages')
          PY
