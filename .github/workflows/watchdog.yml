name: Realt collection watchdog

on:
  schedule:
    - cron: "8,23,38,53 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: realt-collector
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check slots and notify on missing data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/telegram_watchdog.py
      - name: Save alert deduplication state
        if: hashFiles('.github/state/telegram_alerted_slot.txt') != ''
        run: |
          git config user.name "realt-collector"
          git config user.email "bot@users.noreply.github.com"
          git add .github/state/telegram_alerted_slot.txt
          if git diff --cached --quiet; then
            echo "No new alert"
            exit 0
          fi
          git commit -m "monitor: record notified collection slot"
          git pull --rebase origin main
          git push origin HEAD:main
